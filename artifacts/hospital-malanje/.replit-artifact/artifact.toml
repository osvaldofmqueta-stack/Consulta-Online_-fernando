kind = "web"
previewPath = "/"
title = "Hospital de Malanje — Gestão de Consultas"
description = "Aplicação PHP com Tailwind CSS para gestão operacional de pacientes, consultas, mensagens e acompanhamento clínico no Hospital de Malanje."
version = "1.0.0"
id = "artifacts/hospital-malanje"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21990

[services.development]
run = "pnpm --filter @workspace/hospital-malanje run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/hospital-malanje", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/hospital-malanje", "run", "serve" ]

[services.env]
PORT = "21990"
BASE_PATH = "/"
